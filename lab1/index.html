<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Game of Life</h1>
    <canvas id="canvas" width="500" height="500">
    </canvas>
    <div class="controls">
        <button id="startButton"><b>Start</b></button>
        <button id="pauseButton"><b>Pause</b></button>
        <button id="breakButton"><b>Break</b></button>
        <button id="randomButton"><b>Random</b></button>
    </div>
    <h2>Specific patterns: </h2>
    <div class="patterns">

        <button id="deadButton"><b>Dead Loop</b></button>
        <button id="stillButton"><b>Still Image</b></button>
        <button id="gliderButton"><b>Glider</b></button>
    </div>


    <script src="script.js"></script>
</body>

</html>
